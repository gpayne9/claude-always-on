<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f17"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <style>
      @keyframes pulse1 { 0% { opacity: 0.5; r: 70; } 100% { opacity: 0; r: 140; } }
      @keyframes pulse2 { 0% { opacity: 0.4; r: 70; } 100% { opacity: 0; r: 190; } }
      @keyframes glow { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
      @keyframes dash { to { stroke-dashoffset: 0; } }
      .pulse-1 { animation: pulse1 3s ease-out infinite; }
      .pulse-2 { animation: pulse2 3s ease-out 1s infinite; }
      .status-glow { animation: glow 2s ease-in-out infinite; }
      .conn { stroke-dasharray: 10 8; stroke-dashoffset: 36; animation: dash 1.5s linear infinite; }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="540"/><line x1="60" y1="0" x2="60" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="540"/><line x1="180" y1="0" x2="180" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="540"/><line x1="300" y1="0" x2="300" y2="540"/>
    <line x1="360" y1="0" x2="360" y2="540"/><line x1="420" y1="0" x2="420" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/><line x1="540" y1="0" x2="540" y2="540"/>
    <line x1="600" y1="0" x2="600" y2="540"/><line x1="660" y1="0" x2="660" y2="540"/>
    <line x1="720" y1="0" x2="720" y2="540"/><line x1="780" y1="0" x2="780" y2="540"/>
    <line x1="840" y1="0" x2="840" y2="540"/><line x1="900" y1="0" x2="900" y2="540"/>
    <line x1="960" y1="0" x2="960" y2="540"/>
    <line x1="0" y1="0" x2="960" y2="0"/><line x1="0" y1="60" x2="960" y2="60"/>
    <line x1="0" y1="120" x2="960" y2="120"/><line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="240" x2="960" y2="240"/><line x1="0" y1="300" x2="960" y2="300"/>
    <line x1="0" y1="360" x2="960" y2="360"/><line x1="0" y1="420" x2="960" y2="420"/>
    <line x1="0" y1="480" x2="960" y2="480"/><line x1="0" y1="540" x2="960" y2="540"/>
  </g>

  <!-- ===== Title at top ===== -->
  <text x="480" y="52" text-anchor="middle" fill="#ffffff" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="0.5">claude-always-on</text>
  <text x="480" y="82" text-anchor="middle" fill="#999" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16">Persistent remote control sessions for Claude Code</text>

  <!-- ===== CENTER: Mac Mini ===== -->
  <g transform="translate(480, 270)">
    <!-- Pulse rings -->
    <circle cx="0" cy="0" class="pulse-1" fill="none" stroke="#d97706" stroke-width="2"/>
    <circle cx="0" cy="0" class="pulse-2" fill="none" stroke="#d97706" stroke-width="1.5"/>

    <!-- Mac Mini body -->
    <rect x="-90" y="-40" width="180" height="80" rx="16" fill="#2a2a3a" stroke="#555577" stroke-width="2"/>
    <rect x="-82" y="-32" width="164" height="32" rx="8" fill="#32324a" opacity="0.5"/>
    <!-- Apple logo -->
    <g transform="translate(0, -6) scale(1.4)" fill="#aaaacc">
      <path d="M-4,-10 C-4,-13 -1,-16 2,-16 C2,-13 -1,-10 -4,-10Z M4,-9 C1,-9 -1,-8 -3,-8 C-5,-8 -7,-9 -9,-9 C-12,-9 -15,-6 -15,-2 C-15,4 -11,11 -8,11 C-6,11 -5,10 -3,10 C-1,10 0,11 2,11 C5,11 8,5 9,3 C6,2 4,0 4,-3 C4,-6 6,-8 7,-9 C6,-9 5,-9 4,-9Z"/>
    </g>
    <!-- Status LED -->
    <circle cx="0" cy="24" r="4" fill="#22c55e" class="status-glow" filter="url(#glow)"/>
    <!-- Label -->
    <text x="0" y="68" text-anchor="middle" fill="#aaaacc" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" font-weight="600">Mac Mini</text>
  </g>

  <!-- ===== Connection lines (thicker) ===== -->
  <line x1="400" y1="240" x2="195" y2="155" class="conn" stroke="#d97706" stroke-width="2.5" opacity="0.6"/>
  <line x1="560" y1="240" x2="765" y2="155" class="conn" stroke="#d97706" stroke-width="2.5" opacity="0.6"/>
  <line x1="560" y1="305" x2="765" y2="390" class="conn" stroke="#d97706" stroke-width="2.5" opacity="0.6"/>
  <line x1="400" y1="305" x2="195" y2="390" class="conn" stroke="#d97706" stroke-width="2.5" opacity="0.6"/>

  <!-- ===== TOP-LEFT: Desktop App ===== -->
  <g transform="translate(155, 130)">
    <rect x="-55" y="-38" width="110" height="70" rx="6" fill="#1e1e2e" stroke="#555577" stroke-width="1.5"/>
    <text x="-40" y="-14" fill="#22c55e" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11">$ claude</text>
    <text x="-40" y="2" fill="#777799" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10">connected</text>
    <rect x="-40" y="10" width="28" height="8" rx="2" fill="#22c55e" opacity="0.3"/>
    <path d="M-66,34 L-58,32 L58,32 L66,34 Z" fill="#444466"/>
    <text x="0" y="56" text-anchor="middle" fill="#aaaacc" font-family="SF Mono, Menlo, Consolas, monospace" font-size="14" font-weight="600">Desktop App</text>
  </g>

  <!-- ===== TOP-RIGHT: Mobile App ===== -->
  <g transform="translate(805, 130)">
    <rect x="-28" y="-44" width="56" height="88" rx="10" fill="#1e1e2e" stroke="#555577" stroke-width="1.5"/>
    <rect x="-22" y="-34" width="44" height="62" rx="3" fill="#0f0f17"/>
    <circle cx="0" cy="-12" r="10" fill="#d97706" opacity="0.8"/>
    <text x="0" y="-8" text-anchor="middle" fill="#1e1e2e" font-family="Arial, sans-serif" font-size="13" font-weight="bold">C</text>
    <rect x="-16" y="8" width="32" height="3" rx="1.5" fill="#22c55e" opacity="0.5"/>
    <rect x="-16" y="16" width="22" height="3" rx="1.5" fill="#555577" opacity="0.5"/>
    <text x="0" y="68" text-anchor="middle" fill="#aaaacc" font-family="SF Mono, Menlo, Consolas, monospace" font-size="14" font-weight="600">Mobile App</text>
  </g>

  <!-- ===== BOTTOM-RIGHT: Browser ===== -->
  <g transform="translate(805, 395)">
    <rect x="-65" y="-38" width="130" height="76" rx="6" fill="#1e1e2e" stroke="#555577" stroke-width="1.5"/>
    <rect x="-65" y="-38" width="130" height="16" rx="6" fill="#2a2a3a"/>
    <circle cx="-52" cy="-30" r="3.5" fill="#ef4444" opacity="0.7"/>
    <circle cx="-40" cy="-30" r="3.5" fill="#eab308" opacity="0.7"/>
    <circle cx="-28" cy="-30" r="3.5" fill="#22c55e" opacity="0.7"/>
    <rect x="-12" y="-34" width="60" height="9" rx="3" fill="#0f0f17"/>
    <text x="18" y="-27" text-anchor="middle" fill="#777799" font-family="SF Mono, Menlo, Consolas, monospace" font-size="6">claude.ai/code</text>
    <rect x="-54" y="-14" width="44" height="4" rx="2" fill="#555577" opacity="0.4"/>
    <rect x="-54" y="-6" width="72" height="4" rx="2" fill="#d97706" opacity="0.3"/>
    <rect x="-54" y="2" width="56" height="4" rx="2" fill="#555577" opacity="0.3"/>
    <rect x="-54" y="10" width="80" height="4" rx="2" fill="#555577" opacity="0.2"/>
    <rect x="-54" y="18" width="36" height="4" rx="2" fill="#22c55e" opacity="0.3"/>
    <text x="0" y="60" text-anchor="middle" fill="#aaaacc" font-family="SF Mono, Menlo, Consolas, monospace" font-size="14" font-weight="600">claude.ai/code</text>
  </g>

  <!-- ===== BOTTOM-LEFT: tmux ===== -->
  <g transform="translate(155, 395)">
    <rect x="-70" y="-38" width="140" height="76" rx="6" fill="#1e1e2e" stroke="#555577" stroke-width="1.5"/>
    <rect x="-70" y="-38" width="140" height="16" rx="6" fill="#2a2a3a"/>
    <text x="0" y="-26" text-anchor="middle" fill="#777799" font-family="SF Mono, Menlo, Consolas, monospace" font-size="8">tmux: my-project</text>
    <text x="-58" y="-10" fill="#22c55e" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10">Remote Control</text>
    <text x="-58" y="4" fill="#777799" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9">Status: connected</text>
    <text x="-58" y="16" fill="#777799" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9">Sessions: 3/32</text>
    <text x="-58" y="28" fill="#d97706" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9">Uptime: 14d 7h</text>
    <text x="0" y="60" text-anchor="middle" fill="#aaaacc" font-family="SF Mono, Menlo, Consolas, monospace" font-size="14" font-weight="600">tmux session</text>
  </g>

  <!-- ===== Relay label ===== -->
  <g transform="translate(480, 188)">
    <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#d97706" opacity="0.12" stroke="#d97706" stroke-width="0.8"/>
    <text x="0" y="5" text-anchor="middle" fill="#d97706" font-family="SF Mono, Menlo, Consolas, monospace" font-size="13" opacity="0.9">api.anthropic.com</text>
  </g>

  <!-- ===== Always-on indicator ===== -->
  <g transform="translate(480, 510)">
    <circle cx="-50" cy="0" r="5" fill="#22c55e" class="status-glow" filter="url(#glow)"/>
    <text x="-36" y="5" fill="#22c55e" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" font-weight="600">always on</text>
  </g>
</svg>
