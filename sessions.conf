# Claude Always-On — Session Configuration
#
# Define your repos here. One per line, format: session-name:path
# Lines starting with # are ignored. Blank lines are ignored.
#
# The session name is what appears in the Remote Control dropdown
# in claude.ai, the Claude desktop app, and the Claude mobile app.
#
# Examples:
my-project:$HOME/repos/my-project
my-api:$HOME/repos/my-api
my-site:$HOME/repos/my-site
